        "coverLetterText": "Betreff: Bewerbung als Fachinformatiker Anwendungsentwicklung\n\nSehr geehrte Frau Schiller,\n\nich möchte meine berufliche Zukunft gerne bei der IP Dynamics GmbH weiterentwickeln und mich mit großer Motivation um einen Ausbildungsplatz als Fachinformatiker in der Fachrichtung Anwendungsentwicklung bewerben.\n\nDie Arbeit mit aktuellen Technologien wie JavaScript, TypeScript und modernen Frameworks begeistert mich. Auch Themen wie künstliche Intelligenz und moderne Entwicklungsprozesse finde ich spannend und zukunftsweisend. In privaten Projekten konnte ich mir bereits praktische Fähigkeiten in der Anwendungsentwicklung aneignen.\n\nÜber eine Einladung zu einem persönlichen Gespräch freue ich mich sehr.\n\nMit freundlichen Grüßen\nOle Köster"
