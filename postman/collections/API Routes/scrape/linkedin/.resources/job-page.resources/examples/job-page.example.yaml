    content: '{"sourceHostname":"de.linkedin.com","sourceJobId":"4425152530","sourceUrl":"https://de.linkedin.com/jobs/view/softwareentwickler-m-w-d-at-signal-iduna-asset-management-gmbh-4425152530/","title":"Softwareentwickler
      (m/w/d)","company":"SIGNAL IDUNA Asset Management
      GmbH","location":"Hamburg","descriptionText":"Fullstack Entwickler (m/w/d)
      Java/Typescript\n\nDas sind wir\n\nDie SIGNAL IDUNA Asset Management GmbH
      ist ein Tochterunternehmen der SIGNAL IDUNA Gruppe, die zu den großen
      deutschen Versicherungs- und Finanzdienstleistern zählt. Wir bündeln und
      koordinieren die Aktivitäten im Wertpapier-Portfoliomanagement für die
      einzelnen Unternehmen der Gruppe und beraten Mandanten in sämtlichen
      Aspekten der Finanzanlage. Unseren Kunden stellen wir darüber hinaus
      vielfältige Services sowie Vertriebs- und Marketingdienstleistungen rund
      um das Thema Finanzen zur Verfügung. Und wir möchten noch besser werden.
      Mit großen Ideen. Mit motivierten Menschen. Mit Dir.\n\nDas erwartet
      Dich\n\nAls Fullstack Entwickler (m/w/d) Java/TypeScript bist du das
      technische Herzstück unserer modernen Kundenanwendungen. In einem
      engagierten Team arbeitest du an der gesamten Wertschöpfungskette – von
      der Konzeption neuer Features über die Implementierung bis hin zum
      Betrieb.\n\n- Du konzipierst und entwickelst anspruchsvolle Anwendungen
      mit Java/TypeScript im Frontend (Angular) und Backend (Spring Boot)\n- Du
      entwirfst und implementierst REST-APIs sowie ereignisgesteuerte Services,
      vorrangig mit Apache Kafka\n- Du übernimmst die technische Verantwortung
      für den stabilen Betrieb und die Weiterentwicklung deiner Anwendungen
      (DevOps)\n- In enger Abstimmung mit Product Ownern und externen Partnern
      arbeitest du agil nach Scrum und bringst deine Ideen aktiv ein\n- Du
      bringst dich aktiv in Architektur-Entscheidungen ein und entwickelst
      unsere Qualitätsstandards durch Tests und Reviews stetig weite\n\nDas bist
      Du\n\nDu bist Entwickler:in mit Leidenschaft und siehst Code als dein
      Handwerk. Du bringst deine Expertise gerne in einem agilen Team ein, um
      gemeinsam moderne und qualitativ hochwertige Software zu schaffen, die
      unsere Nutzer begeistert.\n\n- Du hast ein abgeschlossenes Studium im
      Bereich Informatik, eine Ausbildung zum Fachinformatiker (m/w/d) oder eine
      vergleichbare Qualifikation\n- Du hast fundierte Berufserfahrung in der
      Anwendungsentwicklung mit Java/TypeScript, idealerweise in der
      Finanzdienstleistungsbranche\n- Du beherrschst moderne Tech-Stacks, z.B.
      Angular, Spring Boot, relationale/NoSQL-Datenbanken und idealerweise
      Apache Kafka\n- Du arbeitest routiniert mit Tools wie Git, Jenkins, Docker
      und Jira\n- Clean Code, Design Patterns und agile Methoden wie Scrum sind
      für dich selbstverständlich\n- Du bist ein kommunikativer Teamplayer, der
      verantwortungsbewusst handelt und sehr gute Deutsch- sowie gute
      Englischkenntnisse mitbringt\n\nDas bieten wir Dir\n\n- Ein spannendes
      Arbeitsumfeld bei dem größten norddeutschen Asset Management
      Unternehmen\n- Attraktive Vergütung inklusive Weihnachts- und
      Urlaubsgeld\n- Flexible Arbeitszeiten, gute Vereinbarkeit von Beruf und
      Familie sowie die Möglichkeit zum mobilen Arbeiten\n- Monatlich 40 Euro
      vermögenswirksame Leistung, ÖPNV-Fahrtkostenzuschuss,
      Mitarbeiterkonditionen und bezuschusstes Essen\n- Gezielte
      Weiterentwicklung deiner persönlichen und fachlichen Kompetenzen\n- Ein
      motiviertes Team, moderne Technik und eine offene, kollaborative
      Arbeitskultur\n- Moderne Technik und Kommunikationsmedien\n\nSie fühlen
      sich angesprochen?\n\nWir freuen uns auf Deine Bewerbungsunterlagen
      (Motivationsschreiben, Lebenslauf und Zeugnisse) mit Angabe Deiner
      Gehaltsvorstellung und Deinem möglichen Eintrittstermin über unser
      Bewerberportal.\n\nFür Fragen steht Dir Lara Kubiak unter
      lara.kubiak@signal-iduna.de zur Verfügung.\n\nWir freuen uns auf Deine
      Bewerbung.\n\nDie gesetzlich vorgesehenen Informationen im Zusammenhang
      mit der Verarbeitung von personenbezogenen Daten sowie die daraus
      resultierenden Rechte können unter
      https://www.signal-iduna.de/datenschutzinfo eingesehen werden.\n\nSIGNAL
      IDUNA Gruppe\n\nPersonalwirtschaft Tochterunternehmen\n\n- Aus Gründen der
      leichteren Lesbarkeit wurde darauf verzichtet, die Formulierung jeweils
      geschlechtsspezifisch auszurichten. Die vollständige Gleichbehandlung
      aller Bewerber unabhängig von ihrer individuellen geschlechtlichen
      Zuordnung ist gewährleistet\n\nKontakt\n\nLara
      Kubiak\n\nEinsatzort\n\nHamburg\n\nSIGNAL IDUNA
      Gruppe\n\nJoseph-Scherer-Straße 3,\n\n44139 Dortmund","postedAt":"Vor 1
