name: Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Authenticate git for private linkedin-job-scraper dependency
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --global url."https://x-access-token:${{ secrets.LINKEDIN_SCRAPER_PAT }}@github.com/".insteadOf "ssh://git@github.com/"

      - run: npm install

      - run: npm run test:once
        env:
          MONGODB_CONNECTION_STRING: mongodb://localhost:27017
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
