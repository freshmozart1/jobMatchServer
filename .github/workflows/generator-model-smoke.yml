name: Generator model smoke check

on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/generator-model-smoke.yml
      - 'src/smokeChecks/**'

permissions:
  contents: read

# Each run bills a live Responses API call, so a newer push to the same pull
# request (or ref) cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Decide whether to run the smoke check
        id: gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            if [ "$EVENT_NAME" = 'pull_request' ]; then
              # GitHub withholds repository secrets from fork and Dependabot pull requests.
              echo '::notice title=Generator model smoke check::Skipped: OPENAI_API_KEY is unavailable (for example on a pull request from a fork).'
              echo 'run=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # On schedule or dispatch the secret is simply missing. Skipping green here
            # would let the check pass forever without verifying anything.
            echo '::error title=Generator model smoke check::OPENAI_API_KEY is not configured for this repository, so the generator model was not checked.'
            exit 1
          fi
          if [ "$EVENT_NAME" = 'pull_request' ]; then
            # On pull_request, HEAD is the merge commit and HEAD^1 is the base tip.
            # Every release PR's `npm version` touches package.json and package-lock.json,
            # so compare what the check depends on rather than trusting the paths filter:
            # the cover-letter-generator pin, the openai SDK the call goes through, and
            # the npm script that runs the check.
            lock_inputs='[.packages["node_modules/cover-letter-generator"].resolved, .packages["node_modules/openai"].version] | map(. // "<none>") | join(" ")'
            script_input='.scripts["smoke:generator-model"] // "<none>"'
            before="$(git show HEAD^1:package-lock.json | jq -r "$lock_inputs") $(git show HEAD^1:package.json | jq -r "$script_input")"
            after="$(jq -r "$lock_inputs" package-lock.json) $(jq -r "$script_input" package.json)"
            if [ "$before" = "$after" ] && git diff --quiet HEAD^1 HEAD -- .github/workflows/generator-model-smoke.yml src/smokeChecks; then
              echo '::notice title=Generator model smoke check::Skipped: the dependencies and the smoke check are unchanged.'
              echo 'run=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Smoke check inputs before: $before"
            echo "Smoke check inputs after: $after"
          fi
          echo 'run=true' >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '24'
          cache: 'npm'

      - name: Authenticate git for private linkedin-job-scraper dependency
        if: steps.gate.outputs.run == 'true'
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --global url."https://x-access-token:${{ secrets.LINKEDIN_SCRAPER_PAT }}@github.com/".insteadOf "ssh://git@github.com/"

      # `npm ci` installs exactly the locked tree the gate reasoned about, and fails
      # loudly if package.json and package-lock.json disagree.
      - run: npm ci
        if: steps.gate.outputs.run == 'true'
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - run: npm run smoke:generator-model
        if: steps.gate.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SMOKE_CHECK_SKIP_ON_UNAUTHORIZED: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
