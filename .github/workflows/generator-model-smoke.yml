name: Generator model smoke check

on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
  pull_request:
    paths:
      - package-lock.json
      - .github/workflows/generator-model-smoke.yml
      - 'src/smokeChecks/**'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Decide whether to run the smoke check
        id: gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo '::notice title=Generator model smoke check::Skipped: OPENAI_API_KEY is unavailable (for example on a pull request from a fork).'
            echo 'run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = 'pull_request' ]; then
            # On pull_request, HEAD is the merge commit and HEAD^1 is the base tip.
            # Every release PR's `npm version` touches package-lock.json, so compare
            # the cover-letter-generator pin itself rather than trusting the paths filter.
            before=$(git show HEAD^1:package-lock.json | jq -r '.packages["node_modules/cover-letter-generator"].resolved // empty')
            after=$(jq -r '.packages["node_modules/cover-letter-generator"].resolved // empty' package-lock.json)
            if [ "$before" = "$after" ] && git diff --quiet HEAD^1 HEAD -- .github/workflows/generator-model-smoke.yml src/smokeChecks; then
              echo '::notice title=Generator model smoke check::Skipped: the cover-letter-generator pin and the smoke check are unchanged.'
              echo 'run=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "cover-letter-generator pin before: ${before:-<none>}"
            echo "cover-letter-generator pin after: ${after:-<none>}"
          fi
          echo 'run=true' >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '24'
          cache: 'npm'

      - name: Authenticate git for private linkedin-job-scraper dependency
        if: steps.gate.outputs.run == 'true'
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --global url."https://x-access-token:${{ secrets.LINKEDIN_SCRAPER_PAT }}@github.com/".insteadOf "ssh://git@github.com/"

      - run: npm install
        if: steps.gate.outputs.run == 'true'
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - run: npm run smoke:generator-model
        if: steps.gate.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SMOKE_CHECK_SKIP_ON_UNAUTHORIZED: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
